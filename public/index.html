```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Minecraft World</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: #79c9ff;
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .sky {
            min-height: 100vh;
            padding: 70px 20px 0;
            position: relative;
            background:
                linear-gradient(#79c9ff 0%, #b5e8ff 75%, #72c83c 75%);
        }

        .cloud {
            position: absolute;
            background: white;
            width: 100px;
            height: 30px;
            box-shadow: 20px -15px white, 40px 0 white;
            opacity: 0.9;
        }

        .cloud.one {
            top: 100px;
            left: 10%;
        }

        .cloud.two {
            top: 180px;
            right: 15%;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: auto;
            padding: 45px 25px;
            background: rgba(30, 30, 30, 0.85);
            border: 5px solid #222;
            box-shadow: 10px 10px 0 #555;
        }

        h1 {
            color: #7cff45;
            font-size: clamp(20px, 4vw, 34px);
            line-height: 1.8;
            text-shadow: 4px 4px #245c16;
            margin-bottom: 25px;
        }

        .subtitle {
            font-size: 10px;
            line-height: 2.2;
            color: #ddd;
            margin-bottom: 30px;
        }

        .grass {
            background: #3c9c24;
            border-top: 15px solid #75d34b;
            padding: 35px 15px;
            margin-top: 60px;
            color: white;
            line-height: 2;
            font-size: 10px;
            box-shadow: inset 0 10px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            padding: 18px 25px;
            background: #55a832;
            color: white;
            text-decoration: none;
            font-size: 10px;
            border: 4px solid #244d18;
            box-shadow: 0 6px #244d18;
            transition: 0.15s;
        }

        .button:hover {
            background: #70c943;
            transform: translateY(3px);
            box-shadow: 0 3px #244d18;
        }

        .blocks {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        .block {
            width: 85px;
            height: 85px;
            border: 4px solid rgba(0,0,0,0.35);
            box-shadow: inset -8px -8px rgba(0,0,0,0.15);
        }

        .dirt {
            background: #98613a;
        }

        .stone {
            background: #888;
        }

        .diamond {
            background: #35d9d9;
        }

        footer {
            background: #292929;
            padding: 25px 10px;
            font-size: 8px;
            line-height: 2;
        }

        @media (max-width: 600px) {
            .content {
                padding: 30px 15px;
            }

            .block {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="sky">
        <div class="cloud one"></div>
        <div class="cloud two"></div>

        <main class="content">
            <h1>WELCOME TO<br>MINECRAFT WORLD</h1>

            <p class="subtitle">
                SELAMAT DATANG DI DUNIA KOTAK-KOTAK!<br>
                EXPLORE • BUILD • SURVIVE
            </p>

            <a href="#about" class="button">START GAME</a>

            <div class="blocks">
                <div class="block dirt"></div>
                <div class="block stone"></div>
                <div class="block diamond"></div>
            </div>
        </main>

        <section class="grass" id="about">
            <h2>YOUR WORLD</h2>
            <p>
                Build your dream world.<br>
                Adventure starts here!
            </p>
        </section>
    </div>

    <footer>
        MINECRAFT STYLE WEBSITE<br>
        DEPLOYED WITH JENKINS CI/CD
    </footer>

</body>
</html>
